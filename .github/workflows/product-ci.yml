name: Product CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - v11-integration

concurrency:
  group: product-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  product-ci:
    name: Product CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: adaptive_agent
          POSTGRES_PASSWORD: adaptive_agent_ci
          POSTGRES_DB: adaptive_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U adaptive_agent -d adaptive_agent_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile application Python
        run: python -m compileall app

      - name: Check frontend JavaScript syntax
        run: node --check app/static/app.js

      - name: Validate Product Understanding fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("tests/fixtures/v11_projects")
          counts = {
              name: sum(path.is_file() for path in (root / name).rglob("*"))
              for name in ("small", "medium", "large")
          }
          assert counts == {"small": 5, "medium": 10, "large": 20}, counts
          cases = json.loads(Path("tests/fixtures/v11_evaluation/cases.json").read_text(encoding="utf-8"))
          assert cases["version"] == "PROJECT-UNDERSTANDING-V1.1"
          assert cases["cases"]
          print(f"fixture counts: {counts}; cases: {len(cases['cases'])}")
          PY

      - name: Product focused tests
        run: |
          unset DATABASE_URL
          python -m unittest -v \
            tests.test_product_persistence \
            tests.test_product_qa \
            tests.test_product_wiring \
            tests.test_context_v1 \
            tests.test_project_understanding_v11 \
            tests.test_conversation_repository \
            tests.test_runtime.RuntimeFlowTests.test_product_auto_route_matrix_uses_task_structure_not_context_size \
            tests.test_runtime.RuntimeFlowTests.test_product_auto_fast_path_does_not_change_research_adaptive

      - name: JSON fallback tests
        run: |
          unset DATABASE_URL
          python - <<'PY'
          import os
          import tempfile
          from pathlib import Path

          from app.core.conversation_repository import JsonConversationRepository, repository_from_environment

          assert not os.getenv("DATABASE_URL")
          with tempfile.TemporaryDirectory() as directory:
              selected = repository_from_environment(
                  database_url=os.getenv("DATABASE_URL"),
                  json_directory=Path(directory),
              )
              assert isinstance(selected, JsonConversationRepository)
          print("JSON fallback selected when DATABASE_URL is unset")
          PY

      - name: PostgreSQL repository roundtrip
        env:
          DATABASE_URL: postgresql://adaptive_agent:adaptive_agent_ci@127.0.0.1:5432/adaptive_agent_test
        run: python -m unittest -v tests.test_postgres_integration

      - name: API health smoke with PostgreSQL
        env:
          DATABASE_URL: postgresql://adaptive_agent:adaptive_agent_ci@127.0.0.1:5432/adaptive_agent_test
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/adaptive-agent-uvicorn.log"
          health_file="$RUNNER_TEMP/adaptive-agent-health.json"
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log >"$log_file" 2>&1 &
          server_pid=$!
          cleanup() {
            if kill "$server_pid" 2>/dev/null; then
              if wait "$server_pid"; then :; else :; fi
            fi
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health >"$health_file"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$log_file"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path(__import__("os").environ["RUNNER_TEMP"], "adaptive-agent-health.json").read_text())
          assert health["status"] == "ok", health
          assert health["service"] == "adaptive-agent-lab", health
          print("health smoke: ok")
          PY

      - name: Research and Pilot isolation check
        shell: bash
        run: |
          set -euo pipefail
          if git cat-file -e de1600d^{commit} 2>/dev/null; then
            changed="$(git diff --name-only de1600d..HEAD -- \
              config/pilot benchmarks evaluation corpus \
              app/core/pilot.py app/core/pilot_executor.py \
              scripts/pilot_harness.py tests/test_pilot.py tests/test_pilot_executor.py)"
            if [ -n "$changed" ]; then
              printf 'Research/Pilot files changed by integration:\n%s\n' "$changed"
              exit 1
            fi
          fi
          echo "Research/Pilot files unchanged in the integration range"

      - name: Secret and repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo ".env must not be tracked"
            exit 1
          fi
          if [ -e .env ]; then
            echo ".env must not be present in CI checkout"
            exit 1
          fi
          if git grep -n -I -E '(^|[^A-Za-z0-9])(sk-[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{30,})' -- .; then
            echo "obvious provider token pattern found in tracked files"
            exit 1
          fi
          echo "secret/repository hygiene: clean"
